<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case 739 — Test Chat</title>
<style>
  :root {
    --bg: #f7f8f7;
    --panel: #ffffff;
    --ink: #16211c;
    --muted: #5b6b62;
    --line: #dde3de;
    --accent: #2f6f5e;
    --accent-ink: #ffffff;
    --user-bubble: #e7efe9;
    --assistant-bubble: #ffffff;
    --danger: #b3432f;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .app {
    width: 100%;
    max-width: 720px;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 20px 18px 14px;
    border-bottom: 1px solid var(--line);
  }
  header h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: 0.1px;
  }
  header p {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
  }
  .config {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 10px;
    font-size: 12px;
    color: var(--muted);
  }
  .config input {
    flex: 1;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 12px;
    background: var(--panel);
    color: var(--ink);
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.assistant { justify-content: flex-start; }
  .bubble {
    max-width: 78%;
    padding: 10px 13px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .row.user .bubble {
    background: var(--accent);
    color: var(--accent-ink);
    border-bottom-right-radius: 3px;
  }
  .row.assistant .bubble {
    background: var(--assistant-bubble);
    border: 1px solid var(--line);
    border-bottom-left-radius: 3px;
  }
  .bubble.error {
    border-color: var(--danger);
    color: var(--danger);
  }
  .bubble.pending {
    color: var(--muted);
    font-style: italic;
  }

  .composer {
    border-top: 1px solid var(--line);
    padding: 14px 18px 18px;
    display: flex;
    gap: 8px;
  }
  .composer textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    line-height: 1.4;
    height: 44px;
    color: var(--ink);
    background: var(--panel);
  }
  .composer textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  .composer button {
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    padding: 0 18px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .composer button:disabled {
    background: #a9b8b0;
    cursor: not-allowed;
  }

  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 0 18px 12px;
  }
  .suggestions button {
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--muted);
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 999px;
    cursor: pointer;
  }
  .suggestions button:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Case 739 — Test Chat</h1>
      <p>Local test page for the clinical case Q&amp;A backend. Not for real patient use.</p>
      <div class="config">
        <label for="apiUrl">API URL</label>
        <input id="apiUrl" value="http://127.0.0.1:8000/api/chat">
      </div>
    </header>

    <div class="suggestions" id="suggestions">
      <button type="button">Hello, how are you?</button>
      <button type="button">Does she have nausea?</button>
      <button type="button">Does she have dysuria?</button>
      <button type="button">What is her blood pressure?</button>
      <button type="button">What is the WBC count?</button>
      <button type="button">What did the ultrasound show?</button>
    </div>

    <div class="messages" id="messages"></div>

    <form class="composer" id="composer">
      <textarea id="input" placeholder="Ask about the case, or just say hi…" autofocus></textarea>
      <button type="submit" id="sendBtn">Send</button>
    </form>
  </div>

<script>
  const messagesEl = document.getElementById('messages');
  const form = document.getElementById('composer');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const apiUrlEl = document.getElementById('apiUrl');
  const suggestions = document.getElementById('suggestions');

  function addBubble(role, text, opts = {}) {
    const row = document.createElement('div');
    row.className = 'row ' + role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (opts.pending ? ' pending' : '') + (opts.error ? ' error' : '');
    bubble.textContent = text;
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  async function sendMessage(text) {
    if (!text.trim()) return;

    addBubble('user', text);
    input.value = '';
    sendBtn.disabled = true;
    const pending = addBubble('assistant', 'Thinking…', { pending: true });

    try {
      const res = await fetch(apiUrlEl.value, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });

      if (!res.ok) {
        const detail = await res.text();
        pending.textContent = `Request failed (${res.status}): ${detail}`;
        pending.classList.add('error');
        pending.classList.remove('pending');
        return;
      }

      const data = await res.json();
      pending.textContent = data.reply;
      pending.classList.remove('pending');
    } catch (err) {
      pending.textContent = 'Could not reach the backend. Is uvicorn running? (' + err.message + ')';
      pending.classList.add('error');
      pending.classList.remove('pending');
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    sendMessage(input.value);
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  suggestions.addEventListener('click', (e) => {
    if (e.target.tagName === 'BUTTON') {
      sendMessage(e.target.textContent);
    }
  });
</script>
</body>
</html>
