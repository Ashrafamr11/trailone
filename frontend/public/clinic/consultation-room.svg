<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="wall" x2="0.85" y2="1"><stop stop-color="#c6d8d1"/><stop offset=".45" stop-color="#e7e8df"/><stop offset="1" stop-color="#ccd5c8"/></linearGradient>
 <linearGradient id="floor" x2="0.1" y2="1"><stop stop-color="#c9bbae"/><stop offset="1" stop-color="#a39384"/></linearGradient>
 <linearGradient id="window" x2=".95" y2="1"><stop stop-color="#f5f9ec"/><stop offset=".5" stop-color="#d4e6d9"/><stop offset="1" stop-color="#b4d3c6"/></linearGradient>
 <linearGradient id="wood" x2="1" y2=".35"><stop stop-color="#b4a18d"/><stop offset=".5" stop-color="#d9c7ae"/><stop offset="1" stop-color="#b7a18d"/></linearGradient>
 <linearGradient id="cabinet" x2="1" y2=".4"><stop stop-color="#e9e6db"/><stop offset="1" stop-color="#c9d2ca"/></linearGradient>
 <radialGradient id="day"><stop stop-color="#ffffff" stop-opacity=".90"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
 <linearGradient id="darken" x2="0" y2="1"><stop stop-color="#143d42" stop-opacity=".06"/><stop offset=".65" stop-color="#143d42" stop-opacity="0"/><stop offset="1" stop-color="#163c42" stop-opacity=".37"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter><filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
 <filter id="shadow" x="-.4" y="-.5" width="1.8" height="2"><feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#344d47" flood-opacity=".17"/></filter>
 <pattern id="grain" width="160" height="160" patternUnits="userSpaceOnUse"><path d="M0 45h160M0 126h160" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/></pattern>
</defs>
<!-- architectural shell -->
<rect width="1600" height="900" fill="url(#wall)"/>
<path d="M0 0H1600L1470 85H130L0 0Z" fill="#faf8ef" opacity=".58"/>
<path d="M0 0L130 85V605H0ZM1600 0L1470 85V605H1600Z" fill="#d3ded7" opacity=".65"/>
<path d="M0 611H1600V900H0Z" fill="url(#floor)"/>
<path d="M0 611H1600" stroke="#fbf9ef" stroke-width="15"/><path d="M0 620H1600" stroke="#a2aca2" stroke-opacity=".4" stroke-width="2"/>
<path d="M0 900L550 612M1600 900L1060 612M0 755L1600 755" stroke="#f9f2e4" stroke-opacity=".20" stroke-width="2"/>
<!-- sunlight and large window -->
<path d="M134 120h345v430H134Z" fill="#e9f0e8" filter="url(#shadow)"/>
<path d="M151 136h310v393H151Z" fill="url(#window)"/>
<path d="M162 140L300 140 170 525Z" fill="#fff" opacity=".25"/>
<g opacity=".45" filter="url(#blur)"><circle cx="210" cy="430" r="80" fill="#6f9e7d"/><circle cx="400" cy="377" r="95" fill="#77a087"/><circle cx="340" cy="480" r="110" fill="#89b99b"/></g>
<path d="M305 136V529M151 329H461" stroke="#fdfcf6" stroke-width="12"/>
<path d="M135 550h343" stroke="#f8f6ec" stroke-width="13"/>
<ellipse cx="400" cy="282" rx="590" ry="380" fill="url(#day)"/>
<!-- clinic wall: clean design on right -->
<rect x="1226" y="130" width="245" height="170" rx="12" fill="#f7f7ef" filter="url(#shadow)"/>
<rect x="1241" y="146" width="215" height="138" rx="3" fill="#d9e7dc"/>
<path d="M1306 220h24m-12-12v24" stroke="#7ba89c" stroke-width="6" stroke-linecap="round"/>
<path d="M1362 212h64m-64 15h45m-45 15h55" stroke="#91b6ae" stroke-opacity=".55" stroke-width="5" stroke-linecap="round"/>
<!-- plant -->
<ellipse cx="1423" cy="735" rx="112" ry="25" fill="#375b51" opacity=".14" filter="url(#soft)"/>
<path d="M1400 624l9 110h50l8-110Z" fill="#d2b8a0"/><path d="M1398 624h72" stroke="#f3e4ce" stroke-width="8"/>
<g stroke="#628b72" stroke-width="6" fill="#6a947b" opacity=".90"><path d="M1432 627V450"/><path d="M1430 574q-85-18-72-77q69 9 72 77ZM1430 536q70-58 81-20q-31 44-81 20ZM1430 497q-49-79-21-92q37 23 21 92Z"/><path d="M1433 596q85-28 96 11q-42 25-96-11Z"/></g>
<!-- right cabinet counter -->
<g filter="url(#shadow)"><rect x="1175" y="506" width="365" height="188" rx="11" fill="url(#cabinet)"/><rect x="1161" y="495" width="389" height="22" rx="5" fill="url(#wood)"/><path d="M1290 516v175M1411 516v175" stroke="#adbfb3" stroke-width="3"/><path d="M1260 566h29m93 0h29m95 0h19" stroke="#91a99e" stroke-width="5" stroke-linecap="round"/></g>
<g opacity=".85"><rect x="1215" y="450" width="68" height="44" rx="3" fill="#f8faf4"/><rect x="1225" y="461" width="48" height="24" rx="2" fill="#d6e9df"/><path d="M1251 467v13m-7-7h14" stroke="#83b3a5" stroke-width="3"/><rect x="1340" y="447" width="65" height="46" rx="5" fill="#c9d8ce"/><path d="M1356 468h32" stroke="#f0f6ed" stroke-width="3"/></g>
<!-- glimpse of patient chair at left, behind avatar -->
<g opacity=".60" filter="url(#soft)"><rect x="65" y="524" width="220" height="125" rx="42" fill="#81a69c"/><path d="M82 614h187l20 100H58Z" fill="#70988e"/><path d="M105 698v74m128-74v74" stroke="#7c8278" stroke-width="14"/></g>
<!-- ceiling pendant -->
<path d="M1025 0v86" stroke="#809d94" stroke-width="5"/><path d="M967 98q0-22 58-22t58 22l-19 16h-78Z" fill="#ecf0e8"/><ellipse cx="1025" cy="113" rx="39" ry="7" fill="#fff" opacity=".65"/>
<!-- foreground tint for cohesive virtual room -->
<rect width="1600" height="900" fill="url(#darken)"/>
<rect width="1600" height="900" fill="url(#grain)"/>
</svg>
